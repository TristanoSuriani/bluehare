<!-- Sample input recording and waveform trimming adapted from Andrea (@andreahaku), PR #29.
     Blue Hare web editor. One file, no libraries. Protocol: EDITOR_PROTOCOL.md.
     Add ?mock=1 to the URL to use a built-in simulated device. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Hare Editor</title>
<style>
  /* Fukiai: Hügelton Instruments' icon font (MIT, FUKIAI-LICENSE.txt). Icons are text in .ic spans;
     they stay hidden until the face has loaded (html.fk), so a missing font never shows boxes. */
  @font-face { font-family: "Fukiai"; src: url("fukiai.ttf") format("truetype"); font-display: block; unicode-range: U+EA00-EB09; }
  :root { --bg: #fff; --fg: #000; --dim: #777; --line: #ccc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  }
  :root[data-theme="dark"] { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         font-variant-numeric: tabular-nums; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--fg); }
  h3 { font-size: 11px; font-weight: 400; color: var(--dim); margin: 4px 0 0; }
  a { color: inherit; }
  .lang { float: right; font-size: 12px; color: var(--dim); text-decoration: underline; background: none; padding: 0; }
  button { font: inherit; background: var(--fg); color: var(--bg); border: 0; padding: 2px 10px; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  button.lang { color: var(--dim); background: none; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 1px 3px; border-radius: 0; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--fg); }
  input[type=checkbox] { accent-color: var(--fg); margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 8px; }
  .dim { color: var(--dim); }
  #status { min-height: 1.4em; }
  section { margin: 12px 0; }
  .groups { columns: 250px; column-gap: 20px; }
  .group { break-inside: avoid; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 46px 1fr 70px; gap: 6px; align-items: center; min-height: 22px; }
  .row .v { text-align: right; white-space: nowrap; }
  .row select { width: 100%; }
  .browser { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .browser select[size] { min-width: 150px; }
  .slots { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 8px; align-items: center; justify-content: start; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); text-align: left; padding: 0 6px 2px 0; }
  td { padding: 1px 6px 1px 0; }
  td.i { color: var(--dim); text-align: right; }
  #steps input[type=text] { width: 120px; }
  #steps input[type=number] { width: 48px; }
  #steps .bad { outline: 1px solid var(--fg); text-decoration: underline wavy; }
  #steps tr.off td { color: var(--dim); }
  .stepcols { columns: 470px; column-gap: 24px; }
  .stepcols table { break-inside: avoid; }
  /* the Sequencer tab on firmware of no steps: the sequencer's placeholder */
  #seqtodo p { font-size: 28px; font-weight: 600; margin: 40px 0; }
  @media (max-width: 600px) {
    .stepcols { columns: auto; overflow-x: auto; }
    #steps input[type=text] { width: 84px; }
    #steps input[type=number] { width: 42px; }
    #steps th, #steps td { padding-right: 3px; }
  }
  footer { margin-top: 24px; font-size: 11px; color: var(--dim); }
  .row.pushed .v { font-weight: 600; }
  .row.modrow { grid-template-columns: 16px 1fr 1fr 1fr 52px; }
  /* librarian: local library and the device's user bank side by side, stacked on a phone */
  .libcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 8px 24px; margin-top: 6px; }
  .libcols > div { min-width: 0; }
  .libcols .bar input[type=search] { flex: 1 1 120px; min-width: 0; }
  .list { height: 260px; overflow: auto; border: 1px solid var(--line); resize: vertical; }
  .list table { width: 100%; table-layout: fixed; }
  .list th { position: sticky; top: 0; background: var(--bg); padding: 1px 6px; }
  .list td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list tr[data-id], .list tr[data-slot] { cursor: pointer; }
  .list tr.sel td { background: var(--fg); color: var(--bg); }
  .list tr.empty td { color: var(--dim); }
  .list tr.over td { outline: 1px dashed var(--fg); outline-offset: -1px; }
  .list.over { outline: 1px solid var(--fg); }
  .list .none { padding: 6px; color: var(--dim); }
  .list col.n { width: 40px; } .list col.e { width: 72px; } .list col.d { width: 78px; }
  .ic { font-family: "Fukiai"; font-style: normal; font-weight: 400; font-synthesis: none; line-height: 1; margin-right: .3em; }
  html:not(.fk) .ic { display: none; }
  /* wave choices: a page-drawn picker so the options can carry an icon (Chrome 135+); native menus get words only */
  @supports (appearance: base-select) {
    select.wave, select.wave::picker(select) { appearance: base-select; }
    select.wave { padding: 1px 3px; min-block-size: 0; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); }
    select.wave > button { font: inherit; background: none; color: inherit; padding: 0; text-align: start; }
    select.wave::picker(select) { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; }
    select.wave option { padding: 1px 6px; min-block-size: 0; }
    select.wave option:checked { font-weight: 600; }
    select.wave option:hover, select.wave option:focus-visible { background: var(--fg); color: var(--bg); }
    select.wave option::checkmark { display: none; }
  }
  /* tabs: a wrapping row of plain buttons, the open one inverted; header stays at the top on wide screens */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 0; }
  @media (max-width: 600px) { .top { position: static; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--fg); margin: 6px 0 0; }
  .tabs button { background: none; color: var(--dim); padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; white-space: nowrap; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
  .trackbar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button, button.tog { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 1px 10px; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .panel { margin: 12px 0; }
  .hint { margin: 16px 0; color: var(--dim); }
  /* sequencer: a step grid over the selected track (16 per row, 8 on a phone) */
  .grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; margin: 6px 0 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .grid button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 2px; min-width: 0; height: 52px;
                 display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; text-align: left; overflow: hidden; font-size: 10px; line-height: 1.15; }
  .grid button .n { color: var(--dim); }
  .grid button .x { overflow: hidden; overflow-wrap: anywhere; flex: 1; }
  .grid button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .grid button.on .n { color: inherit; opacity: .6; }
  .grid button.acc .x { font-weight: 700; }
  .grid button.tie { border-style: dashed; border-color: var(--fg); }
  .grid button.beat { border-left-color: var(--fg); }
  #steps tr.hl td { outline: 1px solid var(--fg); }
  /* mixer: four channel strips as on the device's TRACKS page */
  .mixer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 640px; margin: 6px 0; }
  .strip { border: 1px solid var(--line); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .strip.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .strip .num { font-size: 18px; font-weight: 600; line-height: 1; }
  .strip .snd { font-size: 11px; line-height: 1.3; width: 100%; text-align: center; overflow-wrap: anywhere; min-height: 2.6em; }
  .strip .rec { font-size: 11px; color: var(--dim); }
  .strip .rec.on { color: var(--fg); font-weight: 600; }
  .strip .rec:not(.on) .ic { visibility: hidden; }
  .strip input.fader { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 150px; }
  .strip .v { font-size: 11px; white-space: nowrap; }
  .strip .pan { width: 100%; }
  .strip.muted .fader, .strip.muted .lv { opacity: .35; }
  .strip button { width: 100%; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip button.selb:disabled { opacity: 1; background: none; color: var(--dim); }
  #sysinfo th { padding-right: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <button class="lang" id="lang"></button>
  <h1>Blue Hare Editor</h1>
  <p class="dim"><a href="../installer/" style="color:inherit" data-t="installer"></a></p>
  <!-- always visible: connection, version, sync mode, the tabs and (Sound / Sequencer / Tracks) the track selector -->
  <header class="top">
    <div class="bar">
      <button id="connect" data-t="connect" data-ic="port_usb_c"></button>
      <span id="version" class="dim"></span>
      <span id="live" class="dim"></span>
      <span id="mock" class="dim" hidden data-t="mock"></span>
    </div>
    <div id="status"></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="sound" data-t="sound" data-ic="symbol_audio"></button>
      <button role="tab" data-tab="sequencer" data-t="tabSeq" data-ic="symbol_grid"></button>
      <button role="tab" data-tab="tracks" data-t="tabTracks" data-ic="ui_slider_vertical"></button>
      <button role="tab" data-tab="library" data-t="library" data-ic="symbol_books"></button>
      <button role="tab" data-tab="projects" data-t="projects" data-ic="symbol_folder"></button>
      <button role="tab" data-tab="settings" data-t="tabSettings" data-ic="symbol_cog"></button>
    </nav>
    <div class="trackbar" id="trackbar" hidden><span class="dim" data-t="track"></span><span class="seg" id="trackbtns" role="group"></span></div>
  </header>
  <p class="hint" id="hint" hidden></p>

  <section class="panel" id="p-sound" data-tab="sound" data-dev hidden>
    <div class="browser" id="browser">
      <label><span data-t="engine"></span><br><select id="engine"></select></label>
      <label><span data-t="presets"></span><br><select id="preset" size="8"></select></label>
      <div>
        <p class="bar"><button id="init" data-t="initSound"></button>
          <button id="factlib" data-t="factoryToLib" data-ic="symbol_folder"></button></p>
        <p class="bar"><button id="savefile" data-t="saveFile" data-ic="symbol_download"></button>
          <button id="loadfile" data-t="loadFile" data-ic="symbol_upload"></button>
          <input type="file" id="file" accept=".json,application/json" hidden></p>
      </div>
    </div>
    <p class="dim" id="ctlhelp" data-t="ctlHelp"></p>
    <div class="groups" id="groups"></div>
  </section>

  <section class="panel" id="p-sequencer" data-tab="sequencer" data-dev hidden>
    <!-- firmware of no steps (Blue Hare): the sequencer is a placeholder, TODO; the step sequencer below is hidden -->
    <div id="seqtodo" hidden><p data-t="seqTodo"></p></div>
    <div class="groups" id="seqgroups"></div>
    <div id="steps">
      <h2 data-t="steps" data-ic="note_eight"></h2>
      <p class="bar"><button id="reloadsteps" data-t="reload" data-ic="control_arrow_loop"></button>
        <button id="clearseq" data-t="clearSeq" data-ic="symbol_trash"></button>
        <span class="dim" id="noteshelp"></span></p>
      <div class="grid" id="stepgrid"></div>
      <div class="stepcols" id="steptables"></div>
    </div>
    <div id="motion-panel" hidden style="margin-top:16px">
      <h2 data-t="motion"></h2>
      <p class="bar"><label><input id="motion-on" type="checkbox"> <span data-t="motionOn"></span></label>
        <button id="motion-clear" data-t="motionClear"></button><span id="motion-count" class="dim"></span></p>
      <table id="motion-rows"></table>
    </div>
  </section>

  <section class="panel" id="p-tracks" data-tab="tracks" data-dev hidden>
    <h2 data-t="mixer" data-ic="ui_slider_vertical"></h2>
    <div class="mixer" id="mixer"></div>
    <p class="dim" data-t="mixHelp"></p>
  </section>

  <!-- works without a device too (the device bank shows while connected) -->
  <section class="panel" id="p-library" data-tab="library" hidden>
    <div class="group" id="device-presets" hidden>
      <h2 data-t="devicePresets"></h2>
      <p class="dim" data-t="deviceFavHelp"></p>
      <label><span data-t="deviceList"></span> <select id="device-filter"></select></label>
      <div class="list" id="device-preset-list" style="margin-top:8px"></div>
    </div>
    <div class="libcols" id="libsec">
      <div id="libpane">
        <h2 data-t="library" data-ic="symbol_books"></h2>
        <div class="bar">
          <input type="search" id="libq" spellcheck="false">
          <select id="libeng"></select>
          <select id="libtag"></select>
          <select id="libsort"></select>
        </div>
        <div class="list" id="liblist"></div>
        <p class="bar" style="margin-top:6px">
          <button id="libaud" data-t="audition" data-ic="symbol_audio"></button>
          <button id="libput" data-t="toSlot" data-ic="symbol_upload"></button>
          <button id="libren" data-t="rename"></button>
          <button id="libtags" data-t="tags"></button>
          <button id="libdup" data-t="duplicate"></button>
          <button id="libdel" data-t="delete" data-ic="symbol_trash"></button>
          <button id="libexp1" data-t="exportPatch" data-ic="symbol_download"></button>
        </p>
        <p class="bar">
          <button id="libsave" data-t="saveToLib" data-ic="port_disk"></button>
          <button id="libimport" data-t="import" data-ic="symbol_upload"></button>
          <button id="libexport" data-t="exportLib" data-ic="symbol_download"></button>
          <input type="file" id="libfile" accept=".json,application/json" multiple hidden>
          <span class="dim" id="libcount"></span>
        </p>
      </div>
      <div>
        <h2 data-t="bank" data-ic="port_disk"></h2>
        <p class="dim" id="bankhint"></p>
        <div id="bankpane" hidden>
          <div class="bar"><b id="bankhead"></b></div>
          <div class="list" id="banklist"></div>
          <p class="bar" style="margin-top:6px">
            <button id="bkload" data-t="bankLoad" data-ic="symbol_folder_open"></button>
            <button id="bkstore" data-t="bankStore" data-ic="port_disk"></button>
            <button id="bkget" data-t="bankGet" data-ic="symbol_download"></button>
            <button id="bkerase" data-t="erase" data-ic="symbol_trash"></button>
          </p>
          <p class="bar">
            <button id="bkrefresh" data-t="reload" data-ic="control_arrow_loop"></button>
            <button id="bkexport" data-t="exportBank" data-ic="symbol_download"></button>
            <span class="dim" data-t="dndHelp"></span>
          </p>
        </div>
      </div>
    </div>
  </section>


  <section class="panel" id="p-projects" data-tab="projects" data-dev hidden>
    <h2 data-t="projects" data-ic="symbol_folder"></h2>
    <p class="dim" data-t="projHelp"></p>
    <div class="slots" id="slots"></div>
    <div id="backup-panel" style="margin-top:16px">
      <h2 data-t="backupTitle"></h2>
      <p class="bar"><button id="backup-export" data-t="backupExport"></button>
        <button id="backup-import" data-t="backupImport"></button><input id="backup-file" type="file" accept=".json,application/json" hidden></p>
      <p class="dim" id="backup-help"></p>
    </div>
    <div class="group" id="songchain" hidden style="margin-top:16px">
      <h2 data-t="songTitle"></h2>
      <p class="dim" data-t="songHelp"></p>
      <p class="bar"><button id="songplay"></button><button id="songadd" data-t="songAdd"></button>
        <button id="songremove" data-t="songRemove"></button><span id="songstatus" aria-live="polite"></span></p>
      <div id="songrows"></div>
    </div>
  </section>

  <section class="panel" id="p-settings" data-tab="settings" data-dev hidden>
    <div class="groups" id="setgroups"></div>
    <div class="group" id="device-display" hidden style="margin-top:12px">
      <h2 data-t="deviceDisplay"></h2>
      <p class="dim" data-t="deviceDisplayHelp"></p>
      <div id="device-display-controls"></div>
    </div>
    <div class="group" style="margin-top:12px">
      <h2 data-t="system" data-ic="symbol_cog"></h2>
      <table id="sysinfo"></table>
    </div>
  </section>

  <footer>Felucca by Leo Kuroshita (@kurogedelic), <a href="https://hugelton.com" target="_blank" rel="noopener">Hügelton Instruments</a>. GPL-3.0.<br>
    <span data-t="foot"></span> M-VAVE and FM-1 are trademarks of their respective owners.<br>
    <a href="FUKIAI-LICENSE.txt" data-t="iconsCredit"></a></footer>

<script>
"use strict";
/*PROTO-BEGIN*/
/* ---------------------------------------------------------------- protocol --- */
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, STEP_GET: 6, STEP_SET: 7, PRESET: 8, PROJECT: 9, NAMES: 10,
  SMP_BEGIN: 11, SMP_WRITE: 12, SMP_END: 13, SMP_ERASE: 14, SMP_INFO: 15,   /* (the user sample slots, removed in 1.5) */
  UP_LIST: 16, UP_GET: 17, UP_PUT: 18, UP_STORE: 19, UP_LOAD: 20, UP_ERASE: 21,
  WATCH: 22, CHANGED: 23, RELOAD: 24, PING: 25, STEP_CHANGED: 26,
  TRACK: 27, TRACK_MIX: 28, TRACK_DUMP: 29, TRACK_STEP: 30,
  TRACK_PARAM: 31, TRACK_CHANGED: 32, SONG: 33,
  UI_STATE: 34, UI_SET: 35, UI_PALETTES: 36, FAV_GET: 37, FAV_SET: 38,
  MOTION: 64, BACKUP_LIST: 65, BACKUP_GET: 66, BACKUP_PUT: 67 };   /* (78, 79: the tracker's, gone with it) */
/* frames the device sends on its own (while WATCH is on); never replies */
const PUSH = new Set([CMD.CHANGED, CMD.RELOAD, CMD.STEP_CHANGED, CMD.TRACK_CHANGED]);
/* user preset bank: name 1..12 printable ASCII, a 16-step pattern of (note, flags 1 acc 2 slide 4 tie) */
const UP = { NAME_MAX: 12, PAT: 16, LIST_MAX: 16 };
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, SEMI: 7, ENUM: 8, BPM: 9, NOTE: 10, ONOFF: 11, OCT: 12, STEPS: 13 };

const v14enc = (v) => { const u = Math.max(-8192, Math.min(8191, Math.round(v))) + 8192; return [u & 0x7F, (u >> 7) & 0x7F]; };
const v14dec = (lo, hi) => (lo | (hi << 7)) - 8192;
function strEnc(s) { const a = []; for (const c of String(s)) a.push(c.charCodeAt(0) & 0x7F); a.push(0); return a; }

/* only ever builds F0 7D 46 4C ... F7 */
function frame(cmd, args = []) {
  for (const b of args) if (!(Number.isInteger(b) && b >= 0 && b <= 0x7F)) throw new Error("bad data byte " + b);
  return [0xF0, ...HDR, cmd & 0x7F, ...args, 0xF7];
}
/* -> {cmd, a} or null when it is not an editor frame */
function unframe(d) {
  if (!d || d.length < 6 || d[0] !== 0xF0 || d[d.length - 1] !== 0xF7) return null;
  if (d[1] !== HDR[0] || d[2] !== HDR[1] || d[3] !== HDR[2]) return null;
  return { cmd: d[4], a: Array.from(d.slice(5, d.length - 1)) };
}

/* the DRUM grid (firmware v5): a step's lane hits and their accents, bit l = lane l. Each lane plays its GM note
   (eng_drum.c DRUM_LANE_NOTE) on any engine; LANE_OF: the lane a GM note 35..81 strikes (drum_lane; others fold
   to their octave of 36..47) */
const LANES = ["KICK", "SNARE", "CLAP", "HATCL", "HATOP", "TOM", "RIM", "BELL"];
const LANE_NOTE = [36, 38, 39, 42, 46, 45, 37, 56];
const LANE_OF = "00612153535455757773777675555555773366336665577";
const LANE_ALIAS = { CONGA: 5, CLAVE: 6, CYM: 7, BD: 0, SD: 1, CP: 2, CH: 3, OH: 4 };
const drumLane = (n) => +LANE_OF[(n >= 35 && n <= 81 ? n : 36 + ((n + 120 - 36) % 12)) - 35];
/* the lanes a step strikes (its hits, its notes on their lanes) and which are accented (step_lanes / step_accents) */
const stepLanes = (s) => (s.time !== 0 ? 0 : s.notes.slice(0, s.n).reduce((m, n) => m | (1 << drumLane(n)), s.hit | 0));
const stepAccents = (s) => (s.flags & 1 ? stepLanes(s) : (s.acc | 0) & stepLanes(s));
/* hits as text, an accent marked ">" ("KICK >SNARE HATCL"), and back: null when a word is not a lane */
const hitsText = (hit, acc) => LANES.map((nm, l) => (hit >> l & 1 ? (acc >> l & 1 ? ">" : "") + nm : "")).filter(Boolean).join(" ");
function parseHits(text) {
  let hit = 0, acc = 0;
  for (const w of String(text).toUpperCase().split(/[\s,]+/).filter(Boolean)) {
    const a = w.startsWith(">"), nm = a ? w.slice(1) : w, l = LANES.includes(nm) ? LANES.indexOf(nm) : LANE_ALIAS[nm];
    if (l == null) return null;
    hit |= 1 << l;
    if (a) acc |= 1 << l;
  }
  return { hit, acc };
}
/* the 3 bytes after a step (v5): hit & 127, acc & 127, bit 7 of each; an older firmware's step has none (0) */
const hitsEnc = (hit, acc) => [hit & 0x7F, acc & 0x7F, (hit >> 7 & 1) | (acc >> 7 & 1) << 1];
function readHits(r, o) {
  o.hit = 0; o.acc = 0;
  if (r.i + 3 <= r.a.length) { const h = r.b(), c = r.b(), x = r.b(); o.hit = h | (x & 1) << 7; o.acc = (c | (x & 2) << 6) & o.hit; }
  o.chance = r.i < r.a.length ? r.b() : 100;
  if (o.chance > 100) throw new Error("Invalid step chance");
  o.ratchet = r.i < r.a.length ? r.b() : 1;       /* RATCH (INFO 52 01): the step's hits 1..4; older firmware: 1 */
  if (o.ratchet < 1 || o.ratchet > 4) throw new Error("Invalid step ratchet");
  return o;
}

class Reader {
  constructor(a) { this.a = a; this.i = 0; }
  b() { if (this.i >= this.a.length) throw new Error("short reply"); return this.a[this.i++]; }
  v() { const lo = this.b(); return v14dec(lo, this.b()); }
  s() { let s = ""; for (;;) { const c = this.b(); if (!c) return s; s += String.fromCharCode(c); } }
}

const slotRc = (a) => { const r = new Reader(a); return { slot: r.b(), rc: r.b() }; };   /* slot, rc */
const parse = {
  [CMD.INFO](a) {
    const r = new Reader(a);
    const o = { version: r.s(), nengines: r.b(), pcount: r.b(), gcount: r.b(), nstep: r.b(), pe0: r.b(), engines: [] };
    for (let i = 0; i < o.nengines; i++) o.engines.push(r.s());
    o.chainRows = 0;
    o.ntrk = r.i < a.length ? r.b() : 0;             /* v3: tracks (0 = older firmware, one instrument) */
    o.uiCaps = 0;
    const trailer = a.slice(r.i);
    if (trailer[0] === 16) o.chainRows = 16;       /* existing v6 SONG capability */
    if (trailer.length >= 4 && trailer[0] === 16 && trailer[1] === 0x55 && trailer[2] === 1)
      o.uiCaps = trailer[3] & 15;                 /* tagged preferences; never interpret old PR bytes as SONG */
    o.motionMax = 0; o.chance = false; o.backupCaps = 0;
    o.syncCaps = 0;                               /* live sync: bit 0 WATCH while on keeps pending pushes, bit 1 no RELOAD */
    o.ratchet = 0;                                /* a step's ratchet (STEP_SET's byte after the chance), 0 = none */
    if (o.uiCaps && trailer[4] === 0x4d && trailer[5] === 1 && trailer[6] === 64) {
      o.motionMax = 64; o.chance = trailer[7] === 1;
      /* then tags of 3 bytes (tag, version 1, a value) in any order; Felucca's FM6 tag 46 has 4 (FM6: gone in Blue Hare,
         an older firmware's stepped over); the tracker's 58, last, is gone with it */
      for (let p = 8; p + 2 < trailer.length && trailer[p + 1] === 1;) {
        const t = trailer[p];
        if (t === 0x42) o.backupCaps = trailer[p + 2] & 3;
        else if (t === 0x53) o.syncCaps = trailer[p + 2] & 3;
        else if (t === 0x52) o.ratchet = trailer[p + 2];
        else if (t !== 0x46 && t !== 0x50 && t !== 0x4E && t !== 0x56) break;
        p += t === 0x46 ? 4 : 3;
      }
      if (!o.syncCaps) o.ratchet = 0;
    }
    return o;
  },
  [CMD.UI_STATE](a) {
    const r = new Reader(a), o = { caps: r.b(), palette: r.b(), font: r.b(), monitor: r.b(), filter: r.b() };
    const u28 = () => r.b() | r.b() << 7 | r.b() << 14 | r.b() << 21;
    o.favoriteSig = u28(); o.bankSig = u28(); return o;
  },
  [CMD.UI_SET](a) { const r = new Reader(a); return { rc: r.b(), id: r.b(), value: r.b(), ...parse[CMD.UI_STATE](a.slice(3)) }; },
  [CMD.UI_PALETTES](a) { const r = new Reader(a), n = r.b(); return Array.from({ length: n }, () => r.s()); },
  [CMD.FAV_GET](a) {
    const r = new Reader(a), rc = r.b(); if (rc) return { rc };
    const o = { rc, engine: r.b(), start: r.v(), count: r.b() };
    o.values = Array.from({ length: o.count }, () => !!r.b()); return o;
  },
  [CMD.FAV_SET](a) {
    const r = new Reader(a), rc = r.b();
    return rc === 0 || rc === 3 || rc === 4 ? { rc, engine: r.b(), preset: r.v(), on: !!r.b() } : { rc };
  },
  [CMD.GET](a) { const r = new Reader(a); return { scope: r.b(), id: r.b(), value: r.v() }; },
  [CMD.SET](a) { return parse[CMD.GET](a); },
  /* needs the counts from INFO */
  [CMD.DUMP](a, info) {
    const r = new Reader(a);
    const o = { engine: r.b(), preset: r.b(), p: [], g: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < info.gcount; i++) o.g.push(r.v());
    return o;
  },
  [CMD.DESC](a) {
    const r = new Reader(a);
    const o = { scope: r.b(), id: r.b(), fmt: r.b(), min: r.v(), max: r.v(), def: r.v(), label: r.s(), unit: r.s(), names: [] };
    if (o.fmt === F.ENUM) for (let i = 0; i <= o.max - o.min && i < 24; i++) o.names.push(r.s());
    return o;
  },
  [CMD.STEP_GET](a) {
    const r = new Reader(a);
    const o = { index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
    return readHits(r, o);
  },
  [CMD.STEP_SET](a) { return parse[CMD.STEP_GET](a); },
  [CMD.PRESET](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b() }; },
  [CMD.PROJECT](a) { const r = new Reader(a); return { op: r.b(), slot: r.b(), used: r.b() }; },
  [CMD.SONG](a) {
    const r = new Reader(a);
    const o = { op: r.b(), rc: r.b(), count: r.b(), playing: r.b(), row: r.b(), remaining: r.b(), rows: [] };
    for (let i = 0; i < o.count; i++) o.rows.push({ slot: r.b(), repeat: r.b() });
    return o;
  },
  [CMD.MOTION](a) {
    const r = new Reader(a), o = { track: r.b(), rc: r.b(), on: !!r.b(), count: r.b(), max: r.b(), events: [] };
    if (o.count > o.max || o.max !== 64 || a.length !== 5 + o.count * 4) throw new Error("Invalid motion reply");
    for (let i = 0; i < o.count; i++) o.events.push({ step: r.b(), param: r.b(), value: r.v() });
    return o;
  },
  [CMD.NAMES](a) {
    const r = new Reader(a);
    const o = { engine: r.b(), names: [] };
    const n = r.b();
    for (let i = 0; i < n; i++) o.names.push(r.s());
    o.titles = [];
    try { o.titles.push(r.s(), r.s()); } catch (e) { o.titles = []; }   /* older firmware: no page titles */
    return o;
  },
  [CMD.UP_LIST](a) {
    const r = new Reader(a);
    const o = { start: r.b(), count: r.b(), total: r.b(), slots: [] };
    for (let i = 0; i < o.count; i++) o.slots.push({ slot: o.start + i, used: r.b(), engine: r.b(), name: r.s() });
    return o;
  },
  /* needs P_COUNT from INFO */
  [CMD.UP_GET](a, info) {
    const r = new Reader(a);
    const o = { slot: r.b(), used: r.b(), engine: r.b(), name: r.s(), p: [], pattern: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < UP.PAT; i++) o.pattern.push([r.b(), r.b()]);
    o.grid = null;                                   /* v5: kind 1 = a drum grid (the pairs its low 7 bits), 16 x hi */
    if (r.i < a.length && r.b() === 1 && r.i + UP.PAT <= a.length) {
      o.grid = o.pattern.map(([h, c]) => { const x = r.b(), hit = h | (x & 1) << 7; return [hit, (c | (x & 2) << 6) & hit]; });
      o.pattern = null;
    }
    return o;
  },
  [CMD.UP_PUT](a) { return slotRc(a); },
  [CMD.UP_STORE](a) { return slotRc(a); },
  [CMD.UP_LOAD](a) { return slotRc(a); },
  [CMD.UP_ERASE](a) { return slotRc(a); },
  [CMD.WATCH](a) { return { on: new Reader(a).b() }; },
  [CMD.CHANGED](a) { return parse[CMD.GET](a); },
  [CMD.RELOAD](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  [CMD.PING](a) { return {}; },
  [CMD.STEP_CHANGED](a) { const r = new Reader(a); return { index: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  /* v3: tracks (1.0: four synth parts; earlier firmware: track 4 the drum part, engine byte NENGINES) */
  [CMD.TRACK](a) {
    const r = new Reader(a);
    const o = { sel: r.b(), ntrk: r.b(), tracks: [] };
    for (let i = 0; i < o.ntrk; i++) o.tracks.push({ engine: r.b(), preset: r.b(), level: r.v(), mute: r.b(), armed: r.b() });
    return o;
  },
  [CMD.TRACK_MIX](a) { const r = new Reader(a); return { track: r.b(), level: r.v(), mute: r.b() }; },
  [CMD.TRACK_DUMP](a, info) {
    const r = new Reader(a);
    const o = { track: r.b(), engine: r.b(), preset: r.b(), p: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    return o;
  },
  [CMD.TRACK_STEP](a) {
    const r = new Reader(a);
    return readHits(r, { track: r.b(), index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() });
  },
  /* v4: a parameter of any track (the selection stays), and its push for a track that is not selected */
  [CMD.TRACK_PARAM](a) { const r = new Reader(a); return { track: r.b(), id: r.b(), value: r.v() }; },
  [CMD.TRACK_CHANGED](a) { return parse[CMD.TRACK_PARAM](a); },
};

/* a name the device accepts: printable ASCII, 1..12 characters */
function upName(s) { return String(s ?? "").replace(/[^\x20-\x7E]/g, "").trim().slice(0, UP.NAME_MAX) || "PATCH"; }

const req = {
  uiState: () => [CMD.UI_STATE, []],
  uiSet: (id, value) => [CMD.UI_SET, [id, value]],
  uiPalettes: () => [CMD.UI_PALETTES, []],
  favGet: (engine, start, count) => [CMD.FAV_GET, [engine, ...v14enc(start), count]],
  favSet: (engine, preset, on) => [CMD.FAV_SET, [engine, ...v14enc(preset), on ? 1 : 0]],
  info: () => [CMD.INFO, []],
  get: (scope, id) => [CMD.GET, [scope, id]],
  set: (scope, id, v) => [CMD.SET, [scope, id, ...v14enc(v)]],
  dump: () => [CMD.DUMP, []],
  desc: (scope, id) => [CMD.DESC, [scope, id]],
  stepGet: (i) => [CMD.STEP_GET, [i]],
  stepSet: (i, st) => {
    const n = Math.max(0, Math.min(4, st.n | 0));
    const notes = [0, 1, 2, 3].map((k) => (st.notes[k] | 0) & 0x7F);
    return [CMD.STEP_SET, [i, n, ...notes, Math.max(0, Math.min(2, st.time | 0)), st.flags & 3, (st.vel | 0) & 0x7F,
      ...(st.hit == null && st.chance == null ? [] : hitsEnc(st.hit | 0, st.acc | 0)),
      ...(st.chance == null ? [] : [Math.max(0, Math.min(100, st.chance | 0))]),
      ...(st.chance == null || st.ratchet == null ? [] : [Math.max(1, Math.min(4, st.ratchet | 0))])]];   /* (only after the chance) */
  },
  preset: (e, p) => [CMD.PRESET, [e & 0x7F, p & 0x7F]],
  project: (op, slot) => { if (![0, 1, 2].includes(op)) throw new Error("bad PROJECT op"); return [CMD.PROJECT, [op, slot & 3]]; },   /* 0 load, 1 save, 2 query */
  song: (op = 0, rows = []) => {
    if (![0, 1, 2, 3].includes(op) || rows.length > 16 || rows.some((r) => !Number.isInteger(r.slot) || r.slot < 0 || r.slot > 3 || !Number.isInteger(r.repeat) || r.repeat < 1 || r.repeat > 16)) throw new Error("bad SONG rows");
    return [CMD.SONG, op === 1 ? [op, rows.length, ...rows.flatMap((r) => [r.slot, r.repeat])] : [op]];
  },
  motion: (track, op = 0, arg = {}) => {
    if (!Number.isInteger(track) || track < 0 || track > 3 || ![0, 1, 2, 3, 4].includes(op)) throw new Error("Invalid motion request");
    return [CMD.MOTION, [track, ...(op === 0 ? [] : op === 1 ? [op, arg.on ? 1 : 0] : op === 2 ? [op] :
      [op, arg.step & 63, arg.param & 127, ...(op === 3 ? v14enc(arg.value) : [])])]];
  },
  names: (e) => [CMD.NAMES, [e & 0x7F]],
  upList: (start, count) => [CMD.UP_LIST, [start & 0x7F, Math.max(1, Math.min(UP.LIST_MAX, count | 0))]],
  upGet: (s) => [CMD.UP_GET, [s & 0x7F]],
  /* patch: {engine, name, p: P_COUNT values, pattern: 16 x [note, flags] or grid: 16 x [hit, acc] (v5: kind 1)} */
  upPut: (s, pt) => [CMD.UP_PUT, [s & 0x7F, pt.engine & 0x7F, ...strEnc(upName(pt.name)), ...pt.p.flatMap((v) => v14enc(v ?? 0)),
    ...(pt.grid
      ? [...Array.from({ length: UP.PAT }, (_, i) => hitsEnc(...(pt.grid[i] || [0, 0])).slice(0, 2)).flat(), 1,
         ...Array.from({ length: UP.PAT }, (_, i) => hitsEnc(...(pt.grid[i] || [0, 0]))[2])]
      : Array.from({ length: UP.PAT }, (_, i) => { const x = (pt.pattern || [])[i] || [0, 0]; return [x[0] & 0x7F, x[1] & 7]; }).flat())]],
  upStore: (s, name) => [CMD.UP_STORE, [s & 0x7F, ...strEnc(name ? upName(name) : "")]],   /* "": the device names it ("ANALOG 07") */
  upLoad: (s) => [CMD.UP_LOAD, [s & 0x7F]],
  upErase: (s) => [CMD.UP_ERASE, [s & 0x7F]],
  /* on: 1 = pushes; 3 = also TRACK_CHANGED (v4 firmware answers 3, older firmware 1) */
  watch: (on) => [CMD.WATCH, [on ? (on & 3) | 1 : 0]],
  ping: () => [CMD.PING, []],
  /* v3: tracks 0..3 */
  track: (sel) => [CMD.TRACK, sel == null ? [] : [sel & 0x7F]],
  trackMix: (tr, level, mute) => [CMD.TRACK_MIX, level == null ? [tr & 0x7F] : [tr & 0x7F, ...v14enc(level), mute ? 1 : 0]],
  trackDump: (tr) => [CMD.TRACK_DUMP, [tr & 0x7F]],
  trackStep: (tr, i, st) => [CMD.TRACK_STEP, st ? [tr & 0x7F, ...req.stepSet(i, st)[1]] : [tr & 0x7F, i & 0x7F]],
  /* v4: get (v == null) or set parameter id (P_*) of track tr, clamped as SET */
  trackParam: (tr, id, v) => [CMD.TRACK_PARAM, v == null ? [tr & 0x7F, id & 0x7F] : [tr & 0x7F, id & 0x7F, ...v14enc(v)]],
};

/* which reply belongs to which request (the device echoes these) */
function replyMatches(cmd, args, a) {
  switch (cmd) {
    case CMD.MOTION: return a[0] === args[0];
    case CMD.BACKUP_GET: return a[0] === args[0] && a.slice(2, 7).every((v, i) => v === args[i + 1]);
    case CMD.BACKUP_PUT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UI_SET: return a[1] === args[0] && a[2] === args[1];
    case CMD.FAV_GET: case CMD.FAV_SET:
      return ![0, 3, 4].includes(a[0]) || (a[1] === args[0] && a[2] === args[1] && a[3] === args[2] && a[4] === args[3]);
    case CMD.GET: case CMD.SET: case CMD.DESC: return a[0] === args[0] && a[1] === args[1];
    case CMD.STEP_GET: case CMD.STEP_SET: case CMD.NAMES:
    case CMD.SONG: return a[0] === args[0];
    case CMD.PROJECT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UP_LIST: case CMD.UP_GET: case CMD.UP_PUT: case CMD.UP_STORE: case CMD.UP_LOAD: case CMD.UP_ERASE:
    case CMD.TRACK_MIX: case CMD.TRACK_DUMP: return a[0] === args[0];
    case CMD.WATCH: return (a[0] & 1) === (args[0] & 1);   /* bit 1: v4 firmware only */
    case CMD.TRACK_STEP: case CMD.TRACK_PARAM: return a[0] === args[0] && a[1] === args[1];
    default: return true;
  }
}

/* strict request/response: one frame in flight, the rest queued. Push frames (CHANGED, RELOAD,
   STEP_CHANGED) can come at any time, also between a request and its reply: they go to onPush. */
class Link {
  constructor(send, opts = {}) {
    this.sendRaw = send;
    this.q = [];
    this.cur = null;
    this.closed = false;
    this.lastSent = 0;                              /* Date.now() of the last frame sent (WATCH keep-alive) */
    this.timeout = opts.timeout || 300;
    this.onUnknown = opts.onUnknown || (() => {});
    this.onTimeout = opts.onTimeout || (() => {});
    this.onPush = opts.onPush || (() => {});
    this.onGap = opts.onGap || (() => {});         /* (ms) nothing was sent for that long (WATCH may have ended) */
  }
  get idle() { return !this.cur && !this.q.length; }
  hasQueued(key) { return this.q.some((r) => r.key === key); }
  /* r = [cmd, args]; opt: {timeout, retries, key (coalesce queued requests: the latest args win), front,
     quiet (a timeout is expected: no onTimeout)} */
  request(r, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    const [cmd, args] = r;
    if (opt.key) {
      const old = this.q.find((x) => x.key === opt.key);
      if (old) { old.cmd = cmd; old.args = args; return old.promise; }
    }
    let res, rej;
    const promise = new Promise((a, b) => { res = a; rej = b; });
    const item = { cmd, args, key: opt.key, res, rej, promise, quiet: !!opt.quiet,
      timeout: opt.timeout || this.timeout, retries: opt.retries ?? 1 };
    if (opt.front) this.q.unshift(item); else this.q.push(item);
    this.pump();
    return promise;
  }
  pump() {
    if (this.cur || this.closed || !this.q.length) return;
    this.cur = this.q.shift();
    this.fire();
  }
  fire() {
    const c = this.cur;
    const now = Date.now();
    if (this.lastSent && now - this.lastSent > 2500) this.onGap(now - this.lastSent);
    this.lastSent = now;
    try { this.sendRaw(frame(c.cmd, c.args)); } catch (e) { this.finish(null, e); return; }
    c.timer = setTimeout(() => {
      if (this.cur !== c) return;
      if (c.retries-- > 0) { this.fire(); return; }
      if (!c.quiet) this.onTimeout(c.cmd);
      this.finish(null, new Error("timeout (cmd " + c.cmd + ")"));
    }, c.timeout);
  }
  finish(val, err) {
    const c = this.cur;
    if (!c) return;
    clearTimeout(c.timer);
    this.cur = null;
    if (err) c.rej(err); else c.res(val);
    this.pump();
  }
  /* raw incoming MIDI bytes */
  receive(data) {
    const f = unframe(data);
    if (!f) return;                                  /* not ours (notes, clock, other SysEx) */
    if (PUSH.has(f.cmd)) { this.onPush(f); return; }
    const c = this.cur;
    if (!c || f.cmd !== c.cmd || !replyMatches(c.cmd, c.args, f.a)) { this.onUnknown(f); return; }
    this.finish(f.a);
  }
  close() {
    this.closed = true;
    const all = (this.cur ? [this.cur] : []).concat(this.q);
    if (this.cur) clearTimeout(this.cur.timer);
    this.cur = null;
    this.q = [];
    for (const r of all) r.rej(new Error("closed"));
  }
}

/* ------------------------------------------------------------- formatting --- */
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);   /* 60 = C4 */
/* a note token: a number or a note name (C4, F#3, Bb2) */
function parseNote(tok) {
  if (/^\d+$/.test(tok)) { const n = +tok; return n <= 127 ? n : null; }
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(tok);
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];
  const n = base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return n >= 0 && n <= 127 ? n : null;
}
/* "C4 E4 G4" -> [60, 64, 67]; null on a bad token or more than 4 notes */
function parseNotes(s) {
  const t = s.trim().split(/[\s,]+/).filter(Boolean);
  if (t.length > 4) return null;
  const out = t.map(parseNote);
  return out.includes(null) ? null : out;
}

/* close to the device's param_format (params.c), tables from tools/gen_tables.py */
function fmtValue(d, v) {
  const sign = (x) => (x > 0 ? "+" + x : String(x));
  switch (d.fmt) {
    case F.PCT: return [String(d.max === 100 ? v : Math.trunc((v * 100 + 63) / 127)), "%"];   /* 0..100 (SWG): the value */
    case F.BIPCT: return [sign(Math.trunc(v * 100 / 64)), "%"];
    case F.TIME: {
      const ms10 = Math.round(10 * Math.pow(10000, (v & 127) / 127));
      if (ms10 < 100) return [(ms10 / 10).toFixed(1), "ms"];
      if (ms10 < 10000) return [String(Math.round(ms10 / 10)), "ms"];
      return [(ms10 / 10000).toFixed(2), "s"];
    }
    case F.LFOHZ: { const h = 0.05 * Math.pow(800, (v & 127) / 127); return [h < 10 ? h.toFixed(2) : h.toFixed(1), "Hz"]; }
    case F.CUTOFF: { const h = 30 * Math.pow(16000 / 30, (v & 127) / 127); return h < 1000 ? [String(Math.round(h)), "Hz"] : [(h / 1000).toFixed(1), "kHz"]; }
    case F.DB: return v <= 0 ? ["OFF", ""] : [((v - 112) / 2).toFixed(1), "dB"];
    case F.SEMI: return [sign(v), "st"];
    case F.ENUM: return [d.names[v - d.min] ?? String(v), d.unit || ""];
    case F.BPM: return [String(v), "BPM"];
    case F.NOTE: return [NOTE_NAMES[((v % 12) + 12) % 12], ""];
    case F.ONOFF: return [v ? "ON" : "OFF", ""];
    case F.STEPS: return [String(v), "STEP"];
    default: return [String(v), d.unit || ""];
  }
}

/* the engines removed in 1.5 (their numbers 1, 4, 8, 13 stay retired, named "-" by the device): a library patch of one is
   skipped */
const RETIRED = ["DIGITAL", "SAMPLE", "GRAIN", "SLICE"];
/* -------------------------------------------------------------- librarian --- */
/* A patch (library entry, user preset):
     {name, engine (index), engineName, p: [P_COUNT values by parameter id, null = unknown],
      pattern: 16 x [note 0..127 (0 rest), flags 1 accent | 2 slide | 4 tie] or null,
      grid: 16 x [lane hits 0..255, their accents] or null (a DRUM sound's 16 steps; then no pattern),
      tags: [], created, modified}

   Library / bank / single-patch file (JSON):
     {
       "format": "bluehare-library", "version": 1,
       "kind": "library" | "bank" | "patch",
       "firmware": "BLUE HARE 0.5 ...",          device version string when exported ("" if unknown)
       "pCount": 57, "pE0": 49,                 P_COUNT and the first engine parameter id
       "paramLabels": ["LVL", "ATK", ...],      one key per parameter id: the DESC label, "#2", "#3" appended to
                                                a repeated label (PIT, PIT#2), and "E0".."E7" for the engine
                                                parameters (their labels depend on the engine)
       "engines": ["ANALOG", ...],              engine names by index
       "exported": "2026-10-03T12:00:00.000Z",
       "patches": [{ "name", "engine", "engineName", "params": [pCount numbers or null],
                     "pattern": [[note, flags] x 16] or null, "grid": [[hits, accents] x 16] (when there is one),
                     "tags": [...], "created", "modified",
                     "slot": n (bank files only, 0-based) }]
     }
   Reading maps every parameter by its key, so a firmware with other ids (or more parameters) still gets
   the right values; parameters the file does not have are null (left at the engine default). Engines are
   matched by name. The old single-sound file ("bluehare-patch" version 1, "Save to file") is read too. */
const LIB = { FORMAT: "bluehare-library", VERSION: 1 };

/* parameter keys by id from the instrument DESCs */
function paramKeys(pdesc, pe0, pcount) {
  const seen = {}, out = [];
  for (let i = 0; i < pcount; i++) {
    if (i >= pe0) { out.push("E" + (i - pe0)); continue; }
    const l = (pdesc[i] && pdesc[i].label) || "P" + i;
    seen[l] = (seen[l] || 0) + 1;
    out.push(seen[l] > 1 ? `${l}#${seen[l]}` : l);
  }
  return out;
}
const sameKeys = (a, b) => !!a && !!b && a.length === b.length && a.every((k, i) => k === b[i]);
/* values by fromKeys -> values by toKeys (null where the source has no such key) */
function remapParams(p, fromKeys, toKeys, pe0) {
  if (!fromKeys && toKeys && pe0 && p.length !== toKeys.length) return tailParams(p, toKeys.length, pe0);
  if (!fromKeys || !toKeys || sameKeys(fromKeys, toKeys)) return p.slice();
  const at = new Map(fromKeys.map((k, i) => [k, i]));
  return toKeys.map((k) => (at.has(k) ? p[at.get(k)] ?? null : null));
}

/* values without keys from another firmware: ids below its P_E0 kept their places, its last 8 are E0..E7
   (common ids are only ever appended before P_E0); the rest stay null */
function tailParams(p, n, pe0) {
  const out = Array(n).fill(null), common = Math.max(0, p.length - 8);
  for (let i = 0; i < Math.min(common, pe0); i++) out[i] = p[i] ?? null;
  for (let k = 0; k < 8 && common + k < p.length; k++) out[pe0 + k] = p[common + k] ?? null;
  return out;
}

/* one pattern step as the firmware keeps it (up_pat_norm): a tie has no note, a rest no flags; flags 1 accent, 2 slide,
   4 tie, 8 | 16 the ratchet - 1 (core.h SF_RATCH) */
const patNorm = (n, f) => (f & 4 ? [0, 4] : [n & 0x7F, n ? f & 27 : 0]);
/* sequencer steps (STEP_GET objects) -> 16-step pattern, as the firmware's UP_STORE does (up_pat_from):
   the first note of a NOTE step, flag 4 for a TIE step */
function patternFromSteps(steps) {
  return Array.from({ length: UP.PAT }, (_, i) => {
    const s = steps[i];
    if (!s) return [0, 0];
    return patNorm(s.time === 0 && s.n ? s.notes[0] : 0, s.time === 1 ? 4 : (s.flags & 3) | ((s.ratchet || 1) - 1) << 3);
  });
}
/* pattern -> 16 STEP_SET objects, as the firmware loads one (load_pat16; velocity 96); the ratchet is sent only with a
   chance (req.stepSet) */
function stepsFromPattern(pat) {
  return Array.from({ length: UP.PAT }, (_, i) => {
    const [n, f] = (pat && pat[i]) || [0, 0];
    return { n: n ? 1 : 0, notes: [n & 0x7F, 0, 0, 0], time: f & 4 ? 1 : n ? 0 : 2, flags: n ? f & 3 : 0, vel: n ? 96 : 0,
      ratchet: n ? (f >> 3 & 3) + 1 : 1 };
  });
}
const patternUsed = (pat) => !!pat && pat.some((x) => x && x[0]);
/* a DRUM track's first 16 steps -> a grid, as the firmware's UP_STORE stores one (its notes on their lanes) */
const gridFromSteps = (steps) => Array.from({ length: UP.PAT }, (_, i) => (steps[i] ? [stepLanes(steps[i]), stepAccents(steps[i])] : [0, 0]));

function cleanPatch(pt) {
  const now = new Date().toISOString();
  const pat = Array.isArray(pt.pattern) && pt.pattern.length
    ? Array.from({ length: UP.PAT }, (_, i) => { const x = pt.pattern[i]; return Array.isArray(x) ? patNorm(x[0] | 0, x[1] | 0) : [0, 0]; })
    : null;
  const grid = Array.isArray(pt.grid) && pt.grid.length
    ? Array.from({ length: UP.PAT }, (_, i) => { const x = pt.grid[i]; const h = Array.isArray(x) ? x[0] & 255 : 0; return [h, Array.isArray(x) ? x[1] & h : 0]; })
    : null;
  const o = {
    name: String(pt.name ?? "PATCH").slice(0, 32) || "PATCH",
    engine: pt.engine | 0, engineName: String(pt.engineName ?? ""),
    p: Array.from(pt.p || pt.params || [], (v) => (Number.isFinite(v) ? Math.round(v) : null)),
    pattern: patternUsed(grid) ? null : patternUsed(pat) ? pat : null,
    grid: patternUsed(grid) ? grid : null,
    tags: Array.isArray(pt.tags) ? [...new Set(pt.tags.map((x) => String(x).trim()).filter(Boolean))] : [],
    created: pt.created || now, modified: pt.modified || pt.created || now,
  };
  if (Number.isInteger(pt.slot)) o.slot = pt.slot;
  return o;
}

/* ctx: {keys, engines, firmware, pe0} of the library (the device's when connected) */
function libraryFile(kind, patches, ctx) {
  return {
    format: LIB.FORMAT, version: LIB.VERSION, kind, firmware: ctx.firmware || "",
    pCount: ctx.keys ? ctx.keys.length : 0, pE0: ctx.pe0 ?? null, paramLabels: ctx.keys || [], engines: ctx.engines || [],
    exported: new Date().toISOString(),
    patches: patches.map((x) => {
      const c = cleanPatch(x);
      const o = { name: c.name, engine: c.engine, engineName: c.engineName || (ctx.engines || [])[c.engine] || "",
        params: c.p, pattern: c.pattern, tags: c.tags, created: c.created, modified: c.modified };
      if (c.grid) o.grid = c.grid;
      if (Number.isInteger(x.slot)) o.slot = x.slot;
      return o;
    }),
  };
}
/* -> {patches, skipped, keys (the file's, for a library that has none yet)}; throws on a file it cannot read.
   A patch of an engine the library (the device) does not have, or of a retired one (DIGITAL, SAMPLE, GRAIN, SLICE:
   removed in 1.5, named "-"), is skipped */
function readLibraryFile(obj, ctx) {
  if (!obj || typeof obj !== "object") throw new Error("not JSON");
  const engIndex = (name, idx, fileEngines) => {
    const nm = name || (fileEngines || [])[idx];
    if (nm === "-" || RETIRED.includes(nm)) return -1;
    if (ctx.engines && ctx.engines.length) {
      const e = nm ? ctx.engines.indexOf(nm) : idx < ctx.engines.length ? idx : -1;
      return e >= 0 && ctx.engines[e] !== "-" ? e : -1;
    }
    return idx;
  };
  if (obj.format === "bluehare-patch") {               /* "Save to file": the whole current sound */
    if (!Array.isArray(obj.p) || !Number.isInteger(obj.engine)) throw new Error("bluehare-patch without engine / p");
    const e = engIndex(obj.engineName, obj.engine);
    if (e < 0) return { patches: [], skipped: 1, keys: null };
    const p = ctx.keys && ctx.pe0 && obj.p.length !== ctx.keys.length ? tailParams(obj.p, ctx.keys.length, ctx.pe0)
      : obj.p.slice(0, ctx.keys ? ctx.keys.length : obj.p.length);
    const pt = { name: obj.presetName || obj.engineName || "PATCH", engine: e, engineName: obj.engineName, p,
      pattern: Array.isArray(obj.steps) ? patternFromSteps(obj.steps) : null, tags: ["file"] };
    return { patches: [cleanPatch(pt)], skipped: 0, keys: null };
  }
  if (obj.format !== LIB.FORMAT) throw new Error("unknown format");
  if (!(obj.version >= 1)) throw new Error("version");
  if (!Array.isArray(obj.patches)) throw new Error("no patches");
  const fileKeys = Array.isArray(obj.paramLabels) && obj.paramLabels.length ? obj.paramLabels.map(String) : null;
  const out = [];
  let skipped = 0;
  for (const x of obj.patches) {
    if (!x || !Array.isArray(x.params)) { skipped++; continue; }
    const e = engIndex(x.engineName, x.engine | 0, obj.engines);
    if (e < 0) { skipped++; continue; }
    const p = remapParams(x.params, fileKeys, ctx.keys, ctx.pe0);
    out.push(cleanPatch({ ...x, engine: e, engineName: (ctx.engines || [])[e] || x.engineName || (obj.engines || [])[x.engine], p }));
  }
  return { patches: out, skipped, keys: fileKeys };
}

/* device side; rq(r, opt) -> reply args (Link.request), info from INFO */
const FLASH_OPT = { timeout: 2500, retries: 0 };
const bank = {
  async list(rq) {
    const first = parse[CMD.UP_LIST](await rq(req.upList(0, UP.LIST_MAX)));
    const slots = first.slots.slice();
    while (slots.length < first.total) {
      const r = parse[CMD.UP_LIST](await rq(req.upList(slots.length, Math.min(UP.LIST_MAX, first.total - slots.length))));
      if (!r.count) break;
      slots.push(...r.slots);
    }
    return { total: first.total, slots };
  },
  async get(rq, info, slot) { return parse[CMD.UP_GET](await rq(req.upGet(slot)), info); },
  /* -> rc (0 ok) */
  async put(rq, slot, pt, info) { return parse[CMD.UP_PUT](await rq(req.upPut(slot, pt), FLASH_OPT)).rc; },
  async store(rq, slot, name) { return parse[CMD.UP_STORE](await rq(req.upStore(slot, name), FLASH_OPT)).rc; },
  async load(rq, slot) { return parse[CMD.UP_LOAD](await rq(req.upLoad(slot), { timeout: 1000 })).rc; },
  async erase(rq, slot) { return parse[CMD.UP_ERASE](await rq(req.upErase(slot), FLASH_OPT)).rc; },
};

/* the current sound: DUMP + the first 16 steps */
async function capturePatch(rq, info, name) {
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const steps = [];
  for (let i = 0; i < UP.PAT && i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  const drum = ["DRUM", "KIT"].includes(info.engines[dump.engine]);   /* (a kit track that strikes a lane: its grid; DRUM: a
                                                     Felucca firmware's) */
  return { patch: cleanPatch({ name, engine: dump.engine, engineName: info.engines[dump.engine], p: dump.p, pattern: patternFromSteps(steps),
    grid: drum ? gridFromSteps(steps) : null }), dump, steps };
}

/* the track's own parameters, which no sound load changes (ui.c param_kept): LEVEL, 17..24 (the arpeggiator's until
   2026-10, inert), SCL, LEN DIV SWING GATE (17..32), PAN, MUTE, the SLICER (45..48); with P_E0 83 the chord keys CHRD VOIC (81, 82:
   E0 E1 of the 89-parameter firmware) */
const TRACK_OWN = new Set([0, 39, 40, ...Array.from({ length: 16 }, (_, i) => 17 + i), 45, 46, 47, 48]);
const P_CHORD = [81, 82];                          /* core.h P_CHRD, P_VOIC (since P_COUNT 91, P_E0 83) */
const P_LANES = [83, 84, 85, 86, 87, 88, 89, 90];   /* core.h P_LN0..P_LN7: the DRUM lane levels (since P_COUNT 99, P_E0 91) */
const P_QNTZ = 94;                                  /* core.h P_SQNT: QUANTIZE, the track's (since P_COUNT 103, P_E0 95) */
const trackOwn = (i, pe0) => TRACK_OWN.has(i) || (pe0 >= 83 && P_CHORD.includes(i)) || (pe0 >= 95 && i === P_QNTZ);
/* play a patch without writing flash, as UP_LOAD would load it: the sound only. SET the engine (G_ENGSEL:
   engine defaults and its first preset), then every instrument parameter that differs, except the track's
   own (TRACK_OWN). The steps are never touched. The device keeps a copy of the sound from before (SAVE held
   there = undo) and treats the SETs right after G_ENGSEL as part of this load (EDITOR_PROTOCOL.md "undo").
   opt: {gEng: G_ENGSEL id, progress(i, n)} */
async function auditionPatch(rq, info, pt, opt = {}) {
  await rq(req.set(1, opt.gEng ?? 20, pt.engine));
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const n = Math.min(info.pcount, pt.p.length);
  for (let i = 0; i < n; i++) {
    const v = pt.p[i];
    if (opt.progress) opt.progress(i, n);
    if (v == null || v === dump.p[i] || trackOwn(i, info.pe0)) continue;
    await rq(req.set(0, i, v));
  }
  return {};
}

/* WATCH on (asking for TRACK_CHANGED too): false when the firmware does not know it (older than protocol v2),
   else 1, or 3 when it also has TRACK_PARAM / TRACK_CHANGED (protocol v4) */
async function startWatch(rq) {
  try { const on = parse[CMD.WATCH](await rq(req.watch(3), { timeout: 300, retries: 1, quiet: true })).on; return on & 1 ? on & 3 : false; }
  catch (e) { if (e.message === "closed") throw e; return false; }
}

/* ------------------------------------------------------------ mixer (v3) --- */
/* The TRACKS page in the editor: TRACK (engine, preset, level, mute, armed of all four) and TRACK_DUMP
   of each track for its P_PAN. Level and mute go through TRACK_MIX (any track). Pan: TRACK_PARAM (v4, any track); with v3 firmware a plain SET, which reaches only the
   selected track: another track is selected for it and the selection is put back (TRACK pushes no
   RELOAD). ids: {pan: P_PAN id} */
const mixer = {
  async read(rq, info, ids) {
    const tr = parse[CMD.TRACK](await rq(req.track()));
    for (let i = 0; i < tr.ntrk; i++) {
      const d = parse[CMD.TRACK_DUMP](await rq(req.trackDump(i)), info);
      tr.tracks[i].pan = ids.pan == null ? null : d.p[ids.pan];
    }
    return tr;
  },
  /* -> {track, level, mute} as the device has them now */
  async setMix(rq, track, level, mute, opt) { return parse[CMD.TRACK_MIX](await rq(req.trackMix(track, level, mute), opt)); },
  /* -> the pan value after clamping. v4: TRACK_PARAM, the selection stays */
  async setPan(rq, track, sel, panId, v, v4) {
    if (v4) return parse[CMD.TRACK_PARAM](await rq(req.trackParam(track, panId, v), { key: "pan:" + track })).value;
    if (track === sel) return parse[CMD.SET](await rq(req.set(0, panId, v))).value;
    await rq(req.track(track));
    try { return parse[CMD.SET](await rq(req.set(0, panId, v))).value; }
    finally { await rq(req.track(sel)).catch(() => {}); }
  },
};

/* ---------------------------------------------------------------- tabs --- */
/* one panel at a time; the last one is remembered (localStorage) and in the URL hash (#sound ...) */
const TABS = ["sound", "sequencer", "tracks", "library", "projects", "settings"];
const TAB_KEY = "bluehare-editor-tab";
const TRACK_TABS = new Set(["sound", "sequencer", "tracks"]);
let tab = (() => {
  const h = location.hash.slice(1);
  if (TABS.includes(h)) return h;
  try { const v = localStorage.getItem(TAB_KEY); if (TABS.includes(v)) return v; } catch (e) { /* no storage */ }
  return "sound";
})();
const hasTracks = () => !!dev && !!dev.info && !!dev.info.ntrk;
function showTab(name) {
  if (!TABS.includes(name)) name = "sound";
  const prev = tab;
  tab = name;
  try { localStorage.setItem(TAB_KEY, name); } catch (e) { /* no storage */ }
  if (location.hash !== "#" + name) history.replaceState(null, "", location.pathname + location.search + "#" + name);
  renderPanels();
  if (name === "tracks" && prev !== "tracks" && hasTracks() && dev.dump) op(readMixer);
}
function renderPanels() {
  /* the Tracks tab only with a four-track firmware */
  const tracksOk = !dev || hasTracks() || !dev.info;
  const want = tab === "tracks" && dev && dev.info && !hasTracks() ? "sound" : tab;
  for (const b of $("tabs").querySelectorAll("button[data-tab]")) {
    const on = b.dataset.tab === want;
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
    if (b.dataset.tab === "tracks") b.hidden = !tracksOk;
  }
  const ready = !!dev && !!dev.dump;
  let hint = "";
  for (const p of document.querySelectorAll(".panel")) {
    const mine = p.dataset.tab === want;
    let show = mine && (!("dev" in p.dataset) || ready);
    if (mine && "dev" in p.dataset && !dev) hint = "needDevice";   /* (while connecting the status line says it) */
    p.hidden = !show;
  }
  $("hint").hidden = !hint;
  if (hint) $("hint").textContent = t(hint);
  $("trackbar").hidden = !(ready && hasTracks() && TRACK_TABS.has(want));
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
$("tabs").addEventListener("keydown", (e) => {          /* arrow keys move between the tabs */
  const dir = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!dir) return;
  const bs = [...$("tabs").querySelectorAll("button[data-tab]:not([hidden])")];
  const i = bs.findIndex((b) => b.getAttribute("aria-selected") === "true");
  const n = bs[(i + dir + bs.length) % bs.length];
  e.preventDefault();
  showTab(n.dataset.tab);
  n.focus();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) showTab(h); });

let busy = 0;          /* multi-request operations in progress: no polling */
/* A completion from an unplugged device must not release a new session's work. */
let busyEpoch = 0;
function beginBusy() {
  const epoch = busyEpoch;
  let released = false;
  busy++;
  return () => {
    if (!released && epoch === busyEpoch) busy--;
    released = true;
  };
}
function resetBusy() { busyEpoch++; busy = 0; }

/* the device also pushes RELOAD after loads the editor asked for (PROJECT load, UP_LOAD; before INFO 53 bit 1
   also SET of G_ENGSEL and PRESET); the editor re-reads after those anyway, so it skips that many RELOADs for a
   moment. sound: a PRESET / G_ENGSEL load (no RELOAD comes from newer firmware: none to skip) */
const selfReload = { n: 0, until: 0 };
function selfLoad(sound = false) {
  if (!dev || !dev.watch || (sound && dev.info && dev.info.syncCaps & 2)) return;
  const now = Date.now();
  selfReload.n = now < selfReload.until ? selfReload.n + 1 : 1;
  selfReload.until = now + 1500;
}

  { t: "SCL", pages: [["SCL", 0, [25, 26, 27, 28]], ...(pe0 >= 83 ? [["CHORD", 0, P_CHORD]] : [])] },   /* CHRD VOIC 81, 82 */
  { t: "SEQ PATTERN", tab: "seqgroups", pages: [["PATTERN", 0, [29, 30, 31, 32]]] },
  /* 1.2: as the device shows them: HOME > CLOCK (BPM SWG; CLK not here), MENU > AUDIO TUNE, MENU > MIDI > MIDI IN (G_ROUTE) */
  { t: "GLOBAL", tab: "setgroups", pages: [["CLOCK", 1, [0, 1, 2]], ["AUDIO", 1, [3]], ["MIDI", 1, [14]]] },
];
/* globals that are actions or placeholders on the device: buttons instead, or hidden */
const G_SKIP = new Set(["SLOT", "NAME", "LOAD", "SAVE", "ENG", "SET", "CLRSQ", "INIT", "MIDI", "SYNC", "CPU", "CLK"]);
const key = (s, id) => s + ":" + id;

const gEng = () => { const i = dev.gdesc.findIndex((d) => d && d.label === "ENG"); return i >= 0 ? i : 20; };
const pSlen = () => { const i = dev.pdesc.findIndex((d) => d && d.fmt === F.STEPS); return i >= 0 ? i : P.SLEN; };

const pById = (label, def) => { const i = dev.pdesc.findIndex((d, k) => d && k < dev.info.pe0 && d.label === label); return i >= 0 ? i : def; };
const pPan = () => pById("PAN", 39), pMute = () => pById("MUTE", 40);

/* -------------------------------------------------------------- MIDI --- */
let connecting = false;
async function connect() {
  if (connecting || dev) return;
  connecting = true;
  let connectedDevice = null;
  wantConnected = true;
  if (!MOCK && !navigator.requestMIDIAccess) { connecting = false; sayK("nomidi"); return; }
  $("connect").disabled = true;
  sayK("connecting");
  try {
    if (!access) {
      if (MOCK) { mock = makeMockDevice({ legacy: QS.get("legacy") === "1" }); access = mock.access; }
      else {
        try { access = await navigator.requestMIDIAccess({ sysex: true }); }
        catch (e) { sayK("denied"); return; }
      }
      access.onstatechange = onState;
    }
    const isF = (p) => /blue ?hare/i.test(p.name || "") && p.state !== "disconnected";
    const input = [...access.inputs.values()].find(isF);
    const output = [...access.outputs.values()].find(isF);
    if (!input || !output) { sayK("nodevice"); return; }
    const link = new Link((d) => output.send(d), {
      timeout: 300,
      onUnknown: (f) => console.debug("ignored reply", f),
      onTimeout: () => sayK("noreply"),
      onPush: (f) => onPush(f),
      onGap: () => { rewatch = true; },
    });
    input.onmidimessage = (e) => link.receive(e.data);
    if (input.open) await input.open().catch(() => {});
    dev = { link, input, output, info: null, pdesc: [], gdesc: [], names: [], dump: null, steps: [], slotUsed: [null, null, null, null],
      keys: null, watch: false, bank: null };
    connectedDevice = dev;
    setLabel($("connect"), t("disconnect"));
    await load(connectedDevice);
  } catch (e) {
    console.error(e);
    if (connectedDevice && connectedDevice === dev) { /* an old connection must not close a replacement */
      const timeout = /^timeout/.test(e.message);
      disconnect();
      sayK(timeout ? "noreply" : "error", timeout ? "" : e.message);
    }
  } finally {
    connecting = false;
    $("connect").disabled = false;
  }
}

function disconnect(reasonKey = "disconnected") {
  if (dev) {
    dev.link.close();
    dev.input.onmidimessage = null;
  }
  dev = null;
  resetBusy();
  needReload = false;
  renderPanels();
  renderMixer();
  renderSysinfo();
  renderLive();
  renderLib();
  renderBank();
  renderPreferences(true);
  $("version").textContent = "";
  setLabel($("connect"), t("connect"));
  sayK(reasonKey);
}

function onState(e) {
  const p = e.port;
  if (!p || !/blue ?hare/i.test(p.name || "")) return;
  if (dev && p.state === "disconnected" && (p.id === dev.input.id || p.id === dev.output.id)) {
    disconnect("lost");
  } else if (!dev && wantConnected && p.state === "connected" && p.type === "output") {
    clearTimeout(onState.tm);                       /* the device came back: reconnect */
    onState.tm = setTimeout(() => { if (!dev && wantConnected) connect(); }, 800);
  }
}

function assertSession(d) { if (!d || d !== dev) throw new Error("closed"); }
async function sessionRequest(d, r, opt) {
  assertSession(d);
  const reply = await d.link.request(r, opt);
  assertSession(d);

    /* the first frame after opening the port can be lost: a few tries */
    d.info = parse[CMD.INFO](await sessionRequest(d, req.info(), { timeout: 500, retries: 3 }));
    $("version").textContent = d.info.version;
    const total = d.info.pcount + d.info.gcount;
    for (let i = 0; i < d.info.pcount; i++) { sayK("reading", `${i + 1}/${total}`); d.pdesc[i] = await getDescOrNull(0, i, d); }
    for (let i = 0; i < d.info.gcount; i++) { sayK("reading", `${d.info.pcount + i + 1}/${total}`); d.gdesc[i] = await getDescOrNull(1, i, d); }
    d.titles = [];
    for (let e = 0; e < d.info.nengines; e++) {
      const r = parse[CMD.NAMES](await sessionRequest(d, req.names(e)));
      d.names[e] = r.names;
      d.titles[e] = r.titles;
    }
    for (let k = 0; k < 4; k++) {                    /* PROJECT op 2: is the slot used */
      try { d.slotUsed[k] = parse[CMD.PROJECT](await sessionRequest(d, req.project(2, k))).used; }
      catch (e) { if (e.message === "closed") throw e; }
    }
    d.keys = paramKeys(d.pdesc, d.info.pe0, d.info.pcount);
    await libAdopt(d);
    assertSession(d);
    if (d.info.ntrk) d.sel = parse[CMD.TRACK](await sessionRequest(d, req.track())).sel;   /* v3: the selected track */
    d.dump = await getDump(d);
    if (d.info.chainRows && !seqTodo(d)) d.song = parse[CMD.SONG](await sessionRequest(d, req.song()));   /* (1.5: gone) */
    buildUI();
    renderPanels();
    await loadSteps(d);
    if (d.info.ntrk) await readMixer(d);
    /* protocol v2: live pushes and the user bank; older firmware: DUMP polling, no bank */
    const rqd = (r, o) => sessionRequest(d, r, o);
    d.watch = await startWatch(rqd);
    d.v4 = !!(d.watch & 2);                         /* TRACK_PARAM / TRACK_CHANGED */

      sayK("readingBank");
      try { d.bank = await bank.list((r, o) => sessionRequest(d, r, { ...o, quiet: true })); }
      catch (e) { if (e.message === "closed") throw e; d.bank = null; }

    renderBank();

}

function buildGroups() {

    if (wave) input.append(el("button", {}, el("selectedcontent")));
    for (const v of enumShown(d)) {                 /* (note divisions longest first: #48) */
      const [txt] = fmtValue(d, v);
      const name = d.fmt === F.ENUM && d.names[v - d.min] == null ? String(v) : modDst(d, txt);
      const alias = d.fmt === F.ENUM && aliasOf(d.names, v - d.min) !== v - d.min;   /* shown when set, not offered */

    input.addEventListener("dblclick", () => { input.value = d.def; userSet(s, id, d.def, true); });

}

/* ---------------------------------------------------------- mixer (v3) --- */
/* dev.mix = TRACK reply + pan per track ({sel, ntrk, tracks: [{engine, preset, level, mute, armed, pan}]}).

const mixTouched = (kind, i) => mixDrag === `${kind}:${i}` || performance.now() - (mixEdit.get(`${kind}:${i}`) || 0) < 600

    const o = d.mix.tracks[i];

/* ------------------------------------------------- live sync / polling --- */
/* With WATCH (protocol v2) the device pushes CHANGED / RELOAD / STEP_CHANGED; the editor PINGs about
   once a second so the watch stays on (it ends 3 s after the last request), and DUMPs every 5 s as a
   safety net. Older firmware: DUMP every 400 ms and two steps per round. */

  const d = dev;

  try {
    if (f.cmd === CMD.CHANGED) {
      const c = parse[CMD.CHANGED](f.a);
      if (panning && !c.scope) return;              /* about the track selected for a moment, not ours */
      const arr = c.scope ? d.dump.g : d.dump.p;
      if (c.id >= arr.length) return;
      const k = key(c.scope, c.id);
      if (touched(k)) return;                       /* the user's value wins; their SET follows */
      const old = arr[c.id];
      arr[c.id] = c.value;
      showValue(k, c.value, false);
      blink(k);
      mixFromDump();
      if (!c.scope && c.id === pSlen() && old !== c.value) { $("steptables").dataset.len = ""; renderSteps(); }
    } else if (f.cmd === CMD.RELOAD) {
      d.sel = parse[CMD.RELOAD](f.a).track;          /* v3: another track may be selected on the device */
      if (selfReload.n > 0 && Date.now() < selfReload.until) { selfReload.n--; return; }
      needReload = true;
      maybeReload();
    } else if (f.cmd === CMD.STEP_CHANGED) {
      const { index } = parse[CMD.STEP_CHANGED](f.a);
      if (index < d.info.nstep) refreshStep(index);
    } else if (f.cmd === CMD.TRACK_CHANGED) {       /* v4: level / pan / mute of a track that is not selected */
      const c = parse[CMD.TRACK_CHANGED](f.a), x = d.mix && d.mix.tracks[c.track];
      if (!x || c.track === d.sel) return;
      if (c.id === pPan()) { if (!mixTouched("pan", c.track)) x.pan = c.value; }
      else if (c.id === pMute()) { if (!mixTouched("lv", c.track)) x.mute = c.value ? 1 : 0; }
      else if (c.id === P.LEVEL) { if (!mixTouched("lv", c.track)) x.level = c.value; }

    }

}
function blink(k) {

  if (!c || !c.row) return;
  c.row.classList.add("pushed");
  clearTimeout(c.blink);

/* Patches live in IndexedDB "bluehare-editor": store "patches" (by id), store "meta" ("layout": the
   parameter keys / engine names the stored values are in). Without IndexedDB (some private windows)
   the library is kept in memory only. */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("bluehare-editor", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("patches", { keyPath: "id" }); r.result.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (name, mode, fn) => {
    const db = await open();
    if (!db) return undefined;
    return new Promise((res, rej) => {
      const x = db.transaction(name, mode);
      let out;
      const r = fn(x.objectStore(name));
      if (r) r.onsuccess = () => { out = r.result; };
      x.oncomplete = () => res(out);
      x.onerror = x.onabort = () => rej(x.error || new Error("IndexedDB"));
    });
  };
  return {
    ok: async () => !!(await open()),
    all: () => tx("patches", "readonly", (os) => os.getAll()),
    putMany: (ps) => tx("patches", "readwrite", (os) => { ps.forEach((p) => os.put(p)); }),
    del: (id) => tx("patches", "readwrite", (os) => os.delete(id)),
    getMeta: (k) => tx("meta", "readonly", (os) => os.get(k)),
    setMeta: (k, v) => tx("meta", "readwrite", (os) => os.put(v, k)),
  };
})();

  if (!p || !dev || libBusy) return;
  libOp(async (d, rqf) => {
    if (!engineOk(p)) throw new Error(t("badEngine") + (p.engineName || p.engine));
    sayK("auditioning", p.name);
    selfLoad(true);
    await auditionPatch(rqf, dev.info, p, { gEng: gEng(), track: dev.sel ?? 0,
      progress: (i, n) => { if (i % 8 === 0) sayK("auditioning", `${p.name} ${i}/${n}`); } });
    await afterSoundChange("ready", d);
    sayK("auditioned", p.name);
  });
}
$("libaud").addEventListener("click", () => libAudition(libSel));

$("libsave").addEventListener("click", () => libOp(async (d, rqf) => {
  const def = upName((dev.names[dev.dump.engine] || [])[dev.dump.preset] || dev.info.engines[dev.dump.engine]);
  const name = prompt(t("promptName"), def);
  if (name == null) return;
  const { patch } = await capturePatch(rqf, dev.info, name.trim() || def);
  await libAdd([patch]);
  sayK("savedLib", patch.name);
}));

/* factory preset -> library: PRESET (the sound only), then DUMP; no pattern (the steps are the track's,
   not the preset's) */
$("factlib").addEventListener("click", () => libOp(async (d, rqf) => {
  const e = dev.dump.engine, pi = $("preset").value === "" ? dev.dump.preset : +$("preset").value;
  const name = (dev.names[e] || [])[pi] || "PRESET";
  selfLoad(true);
  await rqf(req.preset(e, pi));
  const { patch } = await capturePatch(rqf, dev.info, name);
  patch.pattern = null;
  patch.grid = null;
  patch.tags = ["factory"];
  await libAdd([patch]);
  await afterSoundChange("ready", d);
  sayK("copiedLib", `${dev.info.engines[e]} ${name}`);
}));

function libPut(id, slot) {
  const p = lib.find((x) => x.id === id);
  if (!p || !dev || !dev.bank || slot == null || libBusy) return;
  const s = dev.bank.slots[slot];
  if (!engineOk(p)) { sayK("badEngine", p.engineName || p.engine); return; }
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async (d, rqf) => {
    checkRc(await bank.put(rqf, slot, { ...p, name: upName(p.name), p: fullParams(p) }, dev.info));
    await refreshSlot(slot, d);
    sayK("putDone", `${slotName(slot)} ${upName(p.name)}`);
  });
}
$("libput").addEventListener("click", () => libPut(libSel, bankSel));

$("libren").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p) return;
  const v = prompt(t("promptName"), p.name);
  if (v == null || !v.trim()) return;
  p.name = v.trim().slice(0, 32);
  libUpdate(p);
});
$("libtags").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p) return;
  const v = prompt(t("promptTags"), p.tags.join(", "));
  if (v == null) return;
  p.tags = [...new Set(v.split(",").map((x) => x.trim()).filter(Boolean))];
  libUpdate(p);
});
$("libdup").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p) libAdd([{ ...p, name: (p.name + " 2").slice(0, 32), created: nowIso(), modified: nowIso() }]);
});
$("libdel").addEventListener("click", async () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p || !confirm(t("confirmDelete").replace("{name}", p.name))) return;
  lib = lib.filter((x) => x !== p);
  libSel = null;
  try { await store.del(p.id); } catch (e) { console.warn(e); }
  renderLib();
});

function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fileSlug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "patch";
const today = () => new Date().toISOString().slice(0, 10);
$("libexp1").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p) download(`bluehare-patch-${fileSlug(p.name)}.json`, libraryFile("patch", [p], libCtx()));
});
$("libexport").addEventListener("click", () => download(`bluehare-library-${today()}.json`, libraryFile("library", lib, libCtx())));
$("libimport").addEventListener("click", () => { $("libfile").value = ""; $("libfile").click(); });
$("libfile").addEventListener("change", async () => {
  let n = 0, skipped = 0;
  for (const f of [...$("libfile").files]) {
    try {
      const obj = JSON.parse(await f.text());
      const ctx = libCtx();
      const r = readLibraryFile(obj, ctx);
      if (!ctx.keys && r.keys) {                     /* no layout yet: the file's becomes the library's */
        libMeta = { keys: r.keys, engines: Array.isArray(obj.engines) ? obj.engines : null, pe0: obj.pE0 ?? null };
        try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
      }
      if (obj.kind === "bank") r.patches.forEach((p) => { if (!p.tags.includes("bank")) p.tags.push("bank"); });
      await libAdd(r.patches);
      n += r.patches.length;
      skipped += r.skipped;
    } catch (e) { sayK("badfile", `${f.name}: ${e.message}`); return; }
  }
  sayK("imported", n + (skipped ? t("skippedN").replace("{n}", skipped) : t("patchesN")));
});

/* device bank */
function bankLoad(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  const s = dev.bank.slots[slot];
  libOp(async (d, rqf) => {
    selfLoad();
    const rc = await bank.load(rqf, slot);
    if (rc) { sayK("emptySlot", slotName(slot)); return; }
    await afterSoundChange("ready", d);
    sayK("loadedUser", `${slotName(slot)} ${s.name}`);
  });
}
$("bkload").addEventListener("click", () => bankLoad(bankSel));
$("bkstore").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  const name = prompt(t("promptNameAuto"), s.used ? s.name : "");
  if (name == null) return;
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async (d, rqf) => {
    checkRc(await bank.store(rqf, slot, name.trim()));
    await refreshSlot(slot, d);
    sayK("storedSlot", `${slotName(slot)} ${dev.bank.slots[slot].name}`);
  });
});
function bankGet(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  libOp(async (d, rqf) => {
    const u = await bank.get(rqf, dev.info, slot);
    if (!u.used) { sayK("emptySlot", slotName(slot)); return; }
    const pt = { name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, grid: u.grid, tags: ["device"] };
    await libAdd([pt]);
    sayK("copiedLib", u.name);
  });
}
$("bkget").addEventListener("click", () => bankGet(bankSel));
$("bkerase").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  if (!s.used || !confirm(t("confirmEraseSlot").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async (d, rqf) => {
    checkRc(await bank.erase(rqf, slot));
    await refreshSlot(slot, d);
    sayK("erasedSlot", slotName(slot));
  });
});
$("bkrefresh").addEventListener("click", () => libOp(async (d, rqf) => {
  sayK("readingBank");
  dev.bank = await bank.list(rqf);
  sayK("ready");
}));
$("bkexport").addEventListener("click", () => libOp(async (d, rqf) => {
  const out = [];
  for (const x of dev.bank.slots) {
    if (!x.used) continue;
    sayK("readingBank", ` ${slotName(x.slot)}`);
    const u = await bank.get(rqf, dev.info, x.slot);
    if (u.used) out.push({ name: u.name, engine: u.engine, p: u.p, pattern: u.pattern, grid: u.grid, slot: x.slot,
      engineName: dev.info.engines[u.engine] });
  }
  download(`bluehare-bank-${today()}.json`, libraryFile("bank", out, libCtx()));
  sayK("ready");
}));

$("connect").addEventListener("click", () => {
  if (dev) { wantConnected = false; disconnect(); } else connect();
});
applyLang();
showTab(tab);
libInit();
if (!MOCK && !navigator.requestMIDIAccess) sayK("nomidi");
})();
</script>
</body>
</html>
